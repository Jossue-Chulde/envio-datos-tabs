<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Resumen</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  @if (datos.enviado()) {

    <ion-card>

      <ion-card-header>
        <ion-card-title>
          Hola, {{ datos.nombre() }}
        </ion-card-title>
      </ion-card-header>

      <ion-card-content>
        <p><strong>Tu dirección es:</strong></p>
        <p>{{ datos.direccion() }}</p>
      </ion-card-content>

      <ion-card-content>
        <p><strong>La edad que enviaste es:</strong></p>
        <h1>{{ datos.edad() }}</h1>
      </ion-card-content>

      <ion-card-content>
        <p><strong>El valor que enviaste es:</strong></p>
        <h1>{{ datos.contador() }}</h1>
      </ion-card-content>

    </ion-card>

  } @else {

    <p>
      Primero ingresa tus datos y pulsa
      “Enviar al resumen”.
    </p>

  }

</ion-content>
